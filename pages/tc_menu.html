<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>automacaoweb</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #77aaff 3px solid;
        }
        header a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }
        #branding {
            float: left;
        }
        #branding h1 {
            margin: 0;
        }
        nav {
            float: right;
            margin-top: 10px;
        }
        nav ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        nav ul li {
            display: inline;
            margin-left: 5px;
        }
        .topics {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .topic {
            background: #fff;
            margin: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 30%;
        }
        .topic img {
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div id="branding">
                <h1>Blog sobre Tecnologia</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#topico1">Tópico 1</a></li>
                    <li><a href="#topico2">Tópico 2</a></li>
                    <li><a href="#topico3">Tópico 3</a></li>
                    <!-- Adicione mais links conforme necessário -->
                </ul>
            </nav>
        </div>
    </header>
    <div class="container">
        <section class="topics">
            <div class="topic" id="topico1">
                <h2>Tópico 1</h2>
                <img src="imagem1.jpg" alt="Imagem do Tópico 1">
                <p>Descrição do tópico 1...</p>
            </div>
            <div class="topic" id="topico2">
                <h2>Tópico 2</h2>
                <img src="imagem2.jpg" alt="Imagem do Tópico 2">
                <p>Descrição do tópico 2...</p>
            </div>
            <div class="topic" id="topico3">
                <h2>Tópico 3</h2>
                <img src="imagem3.jpg" alt="Imagem do Tópico 3">
                <p>Descrição do tópico 3...</p>
            </div>
            <!-- Continue adicionando tópicos até o 18 -->
            <div class="topic" id="topico18">
                <h2>Tópico 18</h2>
                <img src="imagem18.jpg" alt="Imagem do Tópico 18">
                <p>Descrição do tópico 18...</p>
            </div>
        </section>
    </div>
</body>
</html>
