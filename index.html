<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>automacaoweb</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #77aaff 3px solid;
        }
        header a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }
        #branding {
            float: left;
        }
        #branding h1 {
            margin: 0;
        }
        nav {
            float: right;
            margin-top: 10px;
        }
        nav ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        nav ul li {
            display: inline;
            margin-left: 5px;
        }
        .topics {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .topic {
            background: #fff;
            margin: 10px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 30%;
        }
        .topic img {
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div id="branding">
                <h1>...sobre Automação</h1>
            </div>
        </div>
    </header>
    <div class="container">
        <section class="topics">
            <div class="topic" id="topico1">
                <img src="/Images/beckhoff.png" alt="Leia-me">
            </div>
            <div class="topic" id="topico2">
                <img src="/Images/TC 4024.png" width="10" height="35" alt="TwinCAT 3 - Build 4026">
            </div>
            <div class="topic" id="topico3">
                <img src="/Images/TC 4026.png" width="50" height="150" alt="TwinCAT 3 - Build 4026">
            </div>
            <div class="topic" id="topico4">
                <img src="/Images/TF1200.png" width="50" height="150" alt="TwinCAT - HMI">
            </div>              
            <div class="topic" id="topico5">
                <img src="/Images/TF2000.png" alt="TwinCAT - HMI">
            </div>  
            <div class="topic" id="topico6">
                <img src="/Images/TF2000 ADV.png" alt="TwinCAT - HMI">
            </div>                        
            <div class="topic" id="topico7">
                <img src="/Images/TF1800.png" alt="TwinCAT - PLC HMI">
            </div>
            <div class="topic" id="topico8">
                <img src="/Images/TF1810.png" alt="TwinCAT - PLC HMI WEB">
            </div>                                
            <!-- Continue adicionando tópicos até o 18 -->
            <div class="topic" id="topico18">
                <h2>Tópico 18</h2>
                <img src="imagem18.jpg" alt="Imagem do Tópico 18">
                <p>Descrição do tópico 18...</p>
            </div>
        </section>
    </div>
</body>
</html>
