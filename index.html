<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>automacaoweb</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: auto;
            overflow: hidden;
        }

        header {
            background: #333;
            color: #fff;
            padding: 20px 0;
            border-bottom: #77aaff 3px solid;
            text-align: center;
        }

        /* Configuração da Grade */
        .topics {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        /* Cada Card */
        .topic {
            background: #fff;
            margin: 10px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: calc(33.333% - 20px); 
            text-align: center;
            border-radius: 8px;
        }

        /* Estilo das Imagens */
        .topic img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .topic p {
            font-weight: bold;
            color: #333;
            margin: 10px 0 5px;
        }

        /* Responsividade */
        @media (max-width: 992px) {
            .topic {
                width: calc(50% - 20px);
            }
        }

        @media (max-width: 600px) {
            .topic {
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>automacaoweb</h1>
        </div>
    </header>

    <div class="container">
        <section class="topics">
            
            <div class="topic" id="topico1">
                <img src="/Images/beckhoff.png" alt="BECKHOFF">
                <p>Beckhoff</p>
            </div>
            
            <div class="topic" id="topico2">
                <img src="/Images/TC 4024.png" alt="TwinCAT 3 - 4024">
                <p>Build 4024</p>
            </div>

            <div class="topic" id="topico3">
                <img src="/Images/TC 4026.png" alt="TwinCAT 3 - 4026">
                <p>Build 4026</p>
            </div>

            <div class="topic" id="topico4">
                <img src="/Images/TF1200.png" alt="TwinCAT UI CLIENT">
                <p>TF1200</p>
            </div>

            <div class="topic" id="topico5">
                <img src="/Images/TF2000.png" alt="TwinCAT - HMI">
                <p>TF2000</p>
            </div>

            <div class="topic" id="topico6">
                <img src="/Images/TF2000 ADV.png" alt="TwinCAT - HMI ADVANCED">
                <p>TF2000 - Advanced</p>
            </div>

            <div class="topic" id="topico7">
                <img src="/Images/TE9000.png" alt="SAFETY">
                <p>TE9000</p>
            </div>

            <div class="topic" id="topico8">
                <img src="/Images/TF3300.png" alt="TwinCAT - SCOPE">
                <p>TF3300</p>
            </div>

            <div class="topic" id="topico9">
                <img src="/Images/TF3600.png" alt="TwinCAT - Condition Monitoring">
                <p>TF3600</p>
            </div>

            <div class="topic" id="topico10">
                <img src="/Images/TF5000.png" alt="TwinCAT - POINT TO POINT">
                <p>TF5000</p>
            </div>

            <div class="topic" id="topico11">
                <img src="/Images/TF5050.png" alt="TwinCAT - CAMMING">
                <p>TF5050</p>
            </div>

            <div class="topic" id="topico12">
                <img src="/Images/TF5100.png" alt="TwinCAT - NCI">
                <p>TF5100</p>
            </div>

            <div class="topic" id="topico13">
                <img src="/Images/TF5200.png" alt="TwinCAT - CNC">
                <p>TF5200</p>
            </div>

            <div class="topic" id="topico14">
                <img src="/Images/TF6010.png" alt="TwinCAT - ADS MONITOR">
                <p>TF6010</p>
            </div>

            <div class="topic" id="topico15">
                <img src="/Images/TF6100.png" alt="TwinCAT - OPC UA">
                <p>TF6100</p>
            </div>

        </section>
    </div>

</body>
</html>
